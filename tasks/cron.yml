- name: install flock for ansible cron jobs
  package:
    name: util-linux
    state: present

# Spread repository pulls across servers with a random delay of up to five minutes.
# Share a lock across scheduled and boot runs, skipping if a pull is still active.
# Acquire it before the delay so waiting pulls cannot accumulate.
- name: install cron job for ansible
  cron:
    user: ansible
    name: "ansible tasks"
    minute: "*/10"
    job: '/usr/bin/flock -n "$HOME/.ansible-pull.lock" /usr/bin/ansible-pull -o --sleep 300 -U https://github.com/grishtech/LinuxStandardConfig.git > /dev/null'

- name: install cron job for ansible on boot
  cron:
    user: ansible
    name: "ansible reboot"
    special_time: 'reboot'
    job: '/usr/bin/flock -n "$HOME/.ansible-pull.lock" /usr/bin/ansible-pull -o --sleep 300 -U https://github.com/grishtech/LinuxStandardConfig.git > /dev/null'

# Host monitoring agent (node_exporter + vmagent), configured from a separate internal repo so no
# monitoring endpoints live in this public one. It needs its own checkout directory (-d) and lock.
# -o only runs when that repo changed; the daily and boot runs (without -o) re-apply it in case a
# run failed. Opt a host out with: touch /etc/no-host-monitoring
- name: install cron job for host monitoring
  cron:
    user: ansible
    name: "ansible tasks - host monitoring"
    minute: "*/30"
    job: '/usr/bin/flock -n "$HOME/.ansible-pull-monitoring.lock" /usr/bin/ansible-pull -o --sleep 300 -d "$HOME/.ansible/pull-monitoring" -C main -U https://git.grish.io/david/LinuxHostMonitoring.git > /dev/null'

- name: install daily cron job for host monitoring
  cron:
    user: ansible
    name: "ansible host monitoring - daily"
    minute: "17"
    hour: "4"
    job: '/usr/bin/flock -n "$HOME/.ansible-pull-monitoring.lock" /usr/bin/ansible-pull --sleep 300 -d "$HOME/.ansible/pull-monitoring" -C main -U https://git.grish.io/david/LinuxHostMonitoring.git > /dev/null'

- name: install cron job for host monitoring on boot
  cron:
    user: ansible
    name: "ansible host monitoring - reboot"
    special_time: 'reboot'
    job: '/usr/bin/flock -n "$HOME/.ansible-pull-monitoring.lock" /usr/bin/ansible-pull --sleep 300 -d "$HOME/.ansible/pull-monitoring" -C main -U https://git.grish.io/david/LinuxHostMonitoring.git > /dev/null'

- name: install cron job for ansible - internal repositories
  cron:
    state: absent
    user: ansible
    name: "ansible tasks - private"
    minute: "*"
    job: "/usr/bin/ansible-pull -o -U https://git.grish.io/david/StandardLinuxConfig.git > /dev/null"
